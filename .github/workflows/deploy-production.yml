name: Deploy — Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Railway production
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: |
          npx tsc --noEmit
          npm run typecheck --workspace=web
          npm run typecheck --workspace=@erpforge/interviewer-service
          npm run typecheck --workspace=@erpforge/coder-service
          npm run typecheck --workspace=@erpforge/docs-service

      - name: Validate spec schema
        run: npm run validate-schema

      - name: Test
        run: npm test

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy web to production
        run: railway up --service ${{ secrets.RAILWAY_PRODUCTION_SERVICE_ID }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy interviewer service to production
        run: railway up --service ${{ secrets.RAILWAY_PRODUCTION_INTERVIEWER_SERVICE_ID }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy coder service to production
        run: railway up --service ${{ secrets.RAILWAY_PRODUCTION_CODER_SERVICE_ID }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy docs service to production
        run: railway up --service ${{ secrets.RAILWAY_PRODUCTION_DOCS_SERVICE_ID }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # Poll the health endpoint — production gets 8 minutes (longer cold-start budget).
      # PRODUCTION_URL is a repo variable (e.g. https://erpforge.io).
      - name: Wait for production health check
        run: |
          echo "Waiting for production deployment..."
          for i in $(seq 1 48); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
              "${{ vars.PRODUCTION_URL }}/api/health" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✓ Production is healthy after attempt $i"
              exit 0
            fi
            echo "  Attempt $i/48 — HTTP $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "✗ Production did not become healthy within 8 minutes"
          exit 1

      # Production failure → GitHub issue + optional Slack alert.
      - name: Notify production deployment failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 PRODUCTION deployment failed',
              labels: ['deployment-failure', 'production'],
              body: [
                '## ⚠️ Production deployment failed',
                '',
                `**Branch:** \`${context.ref}\``,
                `**Commit:** \`${context.sha.slice(0, 7)}\``,
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                '**Immediate action required.** Check the workflow run for details.',
                '',
                '### Recovery steps',
                '1. Check Railway dashboard for build/deploy errors',
                '2. Roll back via Railway dashboard if needed',
                '3. Fix the issue and push to `main` to re-deploy',
              ].join('\n'),
            });

      # If SLACK_WEBHOOK_URL is set as a secret, also post to Slack.
      - name: Slack alert on production failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then exit 0; fi
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "🚨 *ERP Forge — PRODUCTION deployment failed*\nBranch: `${{ github.ref_name }}`\nCommit: `${{ github.sha }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>"
            }'
