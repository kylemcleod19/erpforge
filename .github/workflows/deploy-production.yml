name: Deploy — Production

# Fires after CI succeeds on a push to `main`. Railway (with "Wait for CI" on)
# handles the actual deploy; this workflow only polls the production health
# endpoint and opens an issue (+ optional Slack alert) if it doesn't come up.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  verify:
    name: Verify production deploy
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      # Production gets 8 minutes (longer cold-start budget).
      - name: Wait for production health check
        run: |
          echo "Waiting for Railway to finish deploying production..."
          for i in $(seq 1 48); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
              "${{ vars.PRODUCTION_ORIGIN_URL }}/api/health" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✓ Production is healthy after attempt $i"
              exit 0
            fi
            echo "  Attempt $i/48 — HTTP $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "✗ Production did not become healthy within 8 minutes"
          exit 1

      - name: Notify production deployment failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 PRODUCTION deployment failed',
              labels: ['deployment-failure', 'production'],
              body: [
                '## ⚠️ Production deployment failed',
                '',
                `**Branch:** \`${context.payload.workflow_run.head_branch}\``,
                `**Commit:** \`${sha.slice(0, 7)}\``,
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Production `/api/health` did not return 200 within 8 minutes of CI passing.',
                '',
                '### Recovery steps',
                '1. Check Railway dashboard for build/deploy errors',
                '2. Roll back via Railway dashboard if needed',
                '3. Fix the issue and push to `main` to re-deploy',
              ].join('\n'),
            });

      - name: Slack alert on production failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then exit 0; fi
          SHA="${{ github.event.workflow_run.head_sha }}"
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"🚨 *ERP Forge — PRODUCTION deployment failed*\nBranch: \`$BRANCH\`\nCommit: \`$SHA\`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>\"
            }"
