name: Deploy — Staging

# Fires after CI succeeds on a push to `dev`. Railway (with "Wait for CI" on)
# handles the actual deploy; this workflow only polls the staging health
# endpoint and opens an issue if it doesn't come up.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]

jobs:
  verify:
    name: Verify staging deploy
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Wait for staging health check
        run: |
          echo "Waiting for Railway to finish deploying staging..."
          for i in $(seq 1 30); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
              "${{ vars.STAGING_ORIGIN_URL }}/api/health" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✓ Staging is healthy after attempt $i"
              exit 0
            fi
            echo "  Attempt $i/30 — HTTP $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "✗ Staging did not become healthy within 5 minutes"
          exit 1

      - name: Notify staging deployment failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Staging deployment failed',
              labels: ['deployment-failure'],
              body: [
                '## Staging deployment failed',
                '',
                `**Branch:** \`${context.payload.workflow_run.head_branch}\``,
                `**Commit:** \`${sha.slice(0, 7)}\``,
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Staging `/api/health` did not return 200 within 5 minutes of CI passing.',
                'Check the Railway dashboard for build/deploy errors.',
              ].join('\n'),
            });
